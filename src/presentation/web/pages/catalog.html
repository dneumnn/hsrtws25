<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Furniture Catalog</title>
    <link rel="stylesheet" href="/styles/catalog.css">
    <script src="/js/catalog.js" defer></script>
</head>
<body>
    <header>
        <h1>Designer Furniture Collection</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/catalog.html">Catalog</a>
            <a href="/basket.html">Basket</a>
        </nav>
    </header>
    
    <main>
        <section class="search-section">
            <h2>Browse Our Collection</h2>
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="Search furniture...">
                <select id="category-filter">
                    <option value="">All Categories</option>
                    <option value="chair">Chairs</option>
                    <option value="table">Tables</option>
                    <option value="sofa">Sofas</option>
                    <option value="storage">Storage</option>
                    <option value="lighting">Lighting</option>
                </select>
                <button id="search-button">Search</button>
            </div>
        </section>

        <section class="products-grid" id="products-grid">
            <!-- Products will be loaded here dynamically -->
            <div class="loading">Loading products...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Designer Furniture Web Shop. All rights reserved.</p>
    </footer>
</body>
</html>
