openapi: 3.0.0
info:
  title: Designer Furniture Web Shop API
  description: API for managing designer furniture products, inventory, shopping basket, and orders
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.furnitureshop.com/v1
    description: Production server

paths:
  /products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Returns a paginated list of all designer furniture products
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          required: false
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search term for product name/description
          required: false
          schema:
            type: string
        - name: min_price
          in: query
          description: Minimum price filter
          required: false
          schema:
            type: number
        - name: max_price
          in: query
          description: Maximum price filter
          required: false
          schema:
            type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
        '400':
          description: Invalid request parameters
    
    post:
      tags:
        - Products
      summary: Create a new product
      description: Creates a new designer furniture product (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)

  /products/{product_id}:
    get:
      tags:
        - Products
      summary: Get product details
      description: Returns detailed information about a specific product including inventory
      parameters:
        - name: product_id
          in: path
          description: Product ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found

  /inventory/{product_id}:
    get:
      tags:
        - Inventory
      summary: Get product inventory status
      description: Returns current inventory status and availability
      parameters:
        - name: product_id
          in: path
          description: Product ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStatus'
        '404':
          description: Product not found

  /basket:
    get:
      tags:
        - Shopping Basket
      summary: Get current shopping basket
      description: Returns the current user's shopping basket with items
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
        '401':
          description: Unauthorized
        '404':
          description: Basket not found
    
    post:
      tags:
        - Shopping Basket
      summary: Add item to basket
      description: Adds a product to the shopping basket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketItemCreate'
      responses:
        '200':
          description: Item added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
        '400':
          description: Invalid quantity or insufficient inventory
        '401':
          description: Unauthorized
        '404':
          description: Product not found

  /basket/items/{item_id}:
    put:
      tags:
        - Shopping Basket
      summary: Update basket item quantity
      description: Updates the quantity of an item in the basket
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          description: Basket item ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Quantity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
        '400':
          description: Invalid quantity or insufficient inventory
        '401':
          description: Unauthorized
        '404':
          description: Item not found
    
    delete:
      tags:
        - Shopping Basket
      summary: Remove item from basket
      description: Removes an item from the shopping basket
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          description: Basket item ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
        '401':
          description: Unauthorized
        '404':
          description: Item not found

  /checkout:
    post:
      tags:
        - Orders
      summary: Complete checkout process
      description: Completes the checkout process and creates an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid checkout data or insufficient inventory
        '401':
          description: Unauthorized
        '404':
          description: Basket not found

  /orders:
    get:
      tags:
        - Orders
      summary: Get user orders
      description: Returns a list of user's orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by order status
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

  /orders/{order_id}:
    get:
      tags:
        - Orders
      summary: Get order details
      description: Returns detailed information about a specific order
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Unauthorized
        '404':
          description: Order not found

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
          format: decimal
        category:
          type: string
        style:
          type: string
        thumbnail:
          type: string
          format: url
        availability:
          type: string
          enum: [in_stock, pre_order, out_of_stock]
        available_quantity:
          type: integer
      required: [id, name, price, category, style, thumbnail, availability, available_quantity]

    ProductDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        category:
          type: string
        style:
          type: string
        specifications:
          type: object
        images:
          type: array
          items:
            type: string
            format: url
        inventory:
          $ref: '#/components/schemas/InventoryStatus'
        delivery_estimate:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, price, category, style, specifications, images, inventory, delivery_estimate, created_at, updated_at]

    ProductCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        category:
          type: string
        style:
          type: string
        specifications:
          type: object
        images:
          type: array
          items:
            type: string
            format: url
      required: [name, description, price, category, style, specifications, images]

    InventoryStatus:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        warehouse_quantity:
          type: integer
        in_transit_quantity:
          type: integer
        expected_arrival_date:
          type: string
          format: date
          nullable: true
        available_quantity:
          type: integer
        status:
          type: string
          enum: [in_stock, pre_order, out_of_stock]
        delivery_estimate:
          type: string
        last_updated:
          type: string
          format: date-time
      required: [product_id, warehouse_quantity, in_transit_quantity, available_quantity, status, delivery_estimate, last_updated]

    Basket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/BasketItem'
        total_items:
          type: integer
        total_amount:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, items, total_items, total_amount, created_at, updated_at]

    BasketItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: decimal
        thumbnail:
          type: string
          format: url
        availability:
          type: string
          enum: [in_stock, pre_order, out_of_stock]
      required: [id, product_id, product_name, quantity, price, thumbnail, availability]

    BasketItemCreate:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required: [product_id, quantity]

    CheckoutRequest:
      type: object
      properties:
        shipping_address:
          $ref: '#/components/schemas/Address'
        billing_address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
          enum: [credit_card, paypal, bank_transfer]
        shipping_method:
          type: string
      required: [shipping_address, billing_address, payment_method, shipping_method]

    Address:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        phone:
          type: string
      required: [first_name, last_name, street, city, state, postal_code, country, phone]

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        total_amount:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, order_number, status, total_amount, created_at, updated_at]

    OrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        total_amount:
          type: number
          format: decimal
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_address:
          $ref: '#/components/schemas/Address'
        billing_address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
        delivery_estimate:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, order_number, status, total_amount, items, shipping_address, billing_address, payment_method, payment_status, delivery_estimate, created_at, updated_at]

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: decimal
        delivery_estimate:
          type: string
        thumbnail:
          type: string
          format: url
      required: [id, product_id, product_name, quantity, price, delivery_estimate, thumbnail]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []